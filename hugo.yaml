
baseURL: "https://seosuwon7364-byte.github.io/kbo-team-analytics/"
languageCode: "ko-kr"
title: "KBO TEAM ANALYTICS"
theme: "template"

defaultContentLanguage: "ko"
defaultContentLanguageInSubdir: false

languages:
  ko:
    languageName: "한국어"
    weight: 1
    contentDir: "content"

outputs:
  home:
    - HTML
    - RSS
    - JSON
  page:
    - HTML
    - RSS

enableRobotsTXT: true

pagination:
  pagerSize: 6

markup:
  goldmark:
    renderer:
      unsafe: true

menus:
  main:
    - identifier: team-analysis
      name: TEAM ANALYSIS
      title: KBO 10개 구단 전력 분석
      url: /team-analysis/
      weight: 1

    - identifier: game-analysis
      name: GAME ANALYSIS
      title: KBO 경기 데이터 분석
      url: /game-analysis/
      weight: 2

params:
  title: "KBO TEAM ANALYTICS"
  customCSS: true
  description: "KBO 10개 구단의 팀 성적과 경기 데이터를 분석하는 야구 데이터 분석 포트폴리오"
  favicon: "https://seosuwon7364-byte.github.io/kbo-team-analytics/fav.png"
  useBootstrapCDN: false
  mathjax: false
  animate: true

  theme:
    disableThemeToggle: false
    defaultTheme: "light"

  color:
    textColor: "#263238"
    secondaryTextColor: "#607D8B"
    textLinkColor: "#173B68"
    backgroundColor: "#FFFFFF"
    secondaryBackgroundColor: "#F3F6F8"
    primaryColor: "#173B68"
    secondaryColor: "#E8F0E8"

    darkmode:
      textColor: "#E8EDF2"
      secondaryTextColor: "#B0BEC5"
      textLinkColor: "#90CAF9"
      backgroundColor: "#101C2C"
      secondaryBackgroundColor: "#1B2A3A"
      primaryColor: "#90CAF9"
      secondaryColor: "#263B32"

  navbar:
    align: ms-auto
    brandName: "KBO TEAM ANALYTICS"
    disableSearch: true
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: true
      disableEducation: true
      disableProjects: false
      disableAchievements: true
      disableContact: true

  hero:
    enable: true
    intro: "BASEBALL DATA ANALYTICS"
    title: "KBO TEAM ANALYTICS"
    subtitle: "야구 데이터를 분석하고 전력을 읽다"
    content: "KBO 10개 구단의 타격, 투수, 수비 지표와 경기 데이터를 분석합니다. 데이터에 기반한 야구 분석과 전력 평가를 목표로 하는 포트폴리오입니다."
    image: "https://seosuwon7364-byte.github.io/kbo-team-analytics/images/baseball-stadium.png"
    bottomImage:
      enable: true
    button:
      enable: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: "https://github.com/seosuwon7364-byte/kbo-team-analytics"

  about:
    enable: true
    title: "ABOUT ME"
    image: "https://seosuwon7364-byte.github.io/kbo-team-analytics/images/me.png"
    content: |-
      컴퓨터인공지능학부에 재학 중이며, 데이터 분석과 야구에 관심을 가지고 있습니다.

      특히 KBO 리그의 경기 기록과 선수 및 구단별 성적 데이터를 활용해 야구 경기의 흐름과 팀의 전력을 분석하는 분야에 관심이 있습니다.

      앞으로 데이터 분석 역량을 발전시켜 프로야구 구단의 전력분석 및 데이터 분석 분야에서 활동하는 것을 목표로 하고 있습니다.
    skills:
      enable: true
      title: "INTERESTS & TECHNOLOGIES"
      items:
        - "Python"
        - "Pandas"
        - "Matplotlib"
        - "SQL"
        - "Data Analysis"
        - "Machine Learning"
        - "Baseball Analytics"

  experience:
    enable: false

  education:
    enable: false

  achievements:
    enable: false

  projects:
    enable: true
    items:
      - title: "KBO 10개 구단 전력 비교 분석 (진행 예정)"
        content: "KBO 10개 구단의 타격, 투수, 수비 지표를 활용해 팀별 전력을 비교하고 주요 지표의 차이를 분석하는 프로젝트입니다."
        image: "https://seosuwon7364-byte.github.io/kbo-team-analytics/images/projects/kbo-team-logos.png"
        badges:
          - "Python"
          - "Pandas"
          - "Data Analysis"

      - title: "KBO 경기 흐름 분석 (진행 예정)"
        content: "이닝별 득점, 홈·원정 경기 결과, 선취점과 승리의 관계 등을 분석해 경기 흐름의 특징을 살펴보는 프로젝트입니다."
        image: "https://seosuwon7364-byte.github.io/kbo-team-analytics/images/projects/kbo-game-analysis.png"
        badges:
          - "Python"
          - "Matplotlib"
          - "Visualization"

      - title: "팀 득점과 승률의 관계 분석 (진행 예정)"
        content: "팀별 득점과 실점, 득실 차이 등의 지표와 최종 승률 사이의 관계를 분석하는 프로젝트입니다."
        image: "https://seosuwon7364-byte.github.io/kbo-team-analytics/images/projects/kbo-winrate-analysis.png"
        badges:
          - "Statistics"
          - "Python"
          - "Data Visualization"

  contact:
    enable: false

