  about:
    enable: true
    title: "ABOUT ME"
    image: "https://seosuwon7364-byte.github.io/kbo-team-analytics/images/me.png"
    content: |-
      컴퓨터인공지능학부에 재학 중이며, 데이터 분석과 야구에 관심을 가지고 있습니다.

      특히 KBO 리그의 경기 기록과 선수 및 구단별 성적 데이터를 활용해 야구 경기의 흐름과 팀의 전력을 분석하는 분야에 관심이 있습니다.

      야구는 단순한 경기 결과뿐 아니라 타율, 출루율, 평균자책점 등 다양한 기록을 통해 팀의 강점과 약점을 분석할 수 있다는 점이 흥미롭습니다. 이러한 데이터를 활용해 경기 결과를 해석하고 팀의 전력을 객관적으로 평가하는 과정에 관심을 갖게 되었습니다.

      앞으로 데이터 분석 역량을 발전시켜 프로야구 구단의 전력분석 및 데이터 분석 분야에서 활동하는 것을 목표로 하고 있습니다.
      ## MY ACTIVITY

      ### KBO TEAM ANALYTICS 포트폴리오 웹사이트 제작

      **활동 기간:** 2026년 11월 (진행 중)

      **활동 유형:** 개인 프로젝트

      **활동 목표:**
      KBO 야구 데이터 분석 결과를 정리하고 공개할 수 있는 개인 포트폴리오 웹사이트 구축

      **담당 작업:**
      - Hugo 테마를 활용한 웹사이트 구성
      - GitHub Actions를 이용한 자동 배포 설정
      - TEAM ANALYSIS 및 GAME ANALYSIS 페이지 제작
      - 이미지 경로 오류 및 YAML 설정 오류 수정
      - CSS를 활용한 글씨체와 반응형 디자인 개선

      **사용 기술 및 선택 이유:**
      Hugo는 정적 웹사이트를 효율적으로 구성하기 위해 선택했고, GitHub Actions는 코드 수정 후 배포 과정을 자동화하기 위해 사용했습니다.

      **현재 결과:**
      홈페이지와 두 개의 분석 소개 페이지를 제작하고 GitHub Pages에 공개했습니다. 실제 KBO 데이터 분석 프로젝트는 진행 예정입니다.

      ### 실제 산출물 및 확인 링크

      이번 프로젝트에서 Hugo를 활용한 개인 포트폴리오 웹사이트를 제작하고 GitHub Pages에 공개했습니다.

      - [KBO TEAM ANALYTICS 홈페이지](https://seosuwon7364-byte.github.io/kbo-team-analytics/) : 제작한 웹사이트의 최종 화면
      - [TEAM ANALYSIS](https://seosuwon7364-byte.github.io/kbo-team-analytics/team-analysis/) : KBO 10개 구단 전력 분석 계획을 정리한 페이지
      - [GAME ANALYSIS](https://seosuwon7364-byte.github.io/kbo-team-analytics/game-analysis/) : 경기 흐름 분석 계획을 정리한 페이지
      - [GitHub 저장소](https://github.com/seosuwon7364-byte/kbo-team-analytics) : 소스 코드와 개발 과정의 커밋 기록

      현재까지의 산출물은 웹사이트와 분석 계획 페이지이며, 실제 KBO 데이터 분석 결과는 추후 추가할 예정입니다.

      **배운 점과 개선 계획:**
      GitHub Pages의 경로 설정과 YAML 문법의 중요성을 배웠습니다. 앞으로 실제 KBO 데이터를 수집하여 분석 결과와 시각화 자료를 추가할 계획입니다.

      ## LEARNING GOALS

      ### 야구 데이터 분석 역량 강화

      **학습 목표:**

      Python과 Pandas를 활용하여 실제 KBO 경기 데이터를 수집하고, 구단별 성적을 분석할 수 있는 역량을 기르는 것이 목표입니다.

      **구체적인 실행 계획:**

      1. KBO 공식 기록 등 신뢰할 수 있는 데이터 출처를 조사합니다.
      2. Python과 Pandas로 구단별 타격 및 투수 기록을 정리합니다.
      3. Matplotlib을 이용해 팀별 지표를 비교하는 그래프를 제작합니다.
      4. 분석 결과를 TEAM ANALYSIS 페이지에 게시합니다.
      5. 분석 과정과 개선 사항을 GitHub에 기록합니다.

      **향후 목표:**

      데이터 분석 프로젝트를 꾸준히 수행하고, 야구 구단의 전력분석 분야에 필요한 통계 및 머신러닝 역량을 발전시키겠습니다.      

      ## LEARNING GOALS

      ### 야구 데이터 분석 역량 강화

      **학습 목표:**

      Python과 Pandas를 활용하여 실제 KBO 경기 데이터를 수집하고, 구단별 성적을 분석할 수 있는 역량을 기르는 것이 목표입니다.

      **구체적인 실행 계획:**

      1. KBO 공식 기록 등 신뢰할 수 있는 데이터 출처를 조사합니다.
      2. Python과 Pandas로 구단별 타격 및 투수 기록을 정리합니다.
      3. Matplotlib을 이용해 팀별 지표를 비교하는 그래프를 제작합니다.
      4. 분석 결과를 TEAM ANALYSIS 페이지에 게시합니다.
      5. 분석 과정과 개선 사항을 GitHub에 기록합니다.

      **향후 목표:**

      데이터 분석 프로젝트를 꾸준히 수행하고, 야구 구단의 전력분석 분야에 필요한 통계 및 머신러닝 역량을 발전시키겠습니다.

      ## SKILLS IN PRACTICE

      ### 실제 프로젝트에 적용한 기술

      **Hugo**
      - KBO TEAM ANALYTICS 포트폴리오 웹사이트 구축
      - 홈페이지와 분석 소개 페이지 구성

      **HTML / CSS**
      - Pretendard 글씨체 적용
      - 프로젝트 카드 디자인 및 반응형 화면 개선

      **Git / GitHub**
      - 프로젝트 소스 코드 버전 관리
      - 작업별 커밋 기록 및 GitHub 저장소 관리

      **GitHub Actions**
      - main 브랜치에 코드를 업로드하면 자동으로 사이트를 빌드하고 배포하도록 설정
      - 배포 오류 발생 시 실행 로그를 확인하고 수정

      ### 앞으로 활용할 기술

      **Python / Pandas**
      - KBO 구단별 타격 및 투수 데이터 정리와 분석에 활용할 계획

      **Matplotlib**
      - 구단별 기록과 경기 데이터를 그래프로 시각화할 계획

